# master에 푸시할 때마다 깃허브가 사이트를 빌드해 GitHub Pages에 올린다.
#
# dist/ 를 커밋하지 않는 이유는 CLAUDE.md의 "빌드 산출물은 git 추적 안 함" 규칙 때문이다.
# 그래서 배포처가 소스를 받아 직접 굽는다.
#
# npm 패키지가 0개라 설치 단계가 없다. Node를 켜고 빌드 스크립트를 돌리면 끝이다.

name: 블로그 배포

on:
  push:
    branches: [master]
  # 코드 변경 없이 다시 배포하고 싶을 때를 위해 수동 실행도 열어둔다.
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한만 준다.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다. 진행 중인 배포를 중간에 끊지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 테스트
        run: node --test "src/*.test.mjs"

      # --drafts 를 붙이지 않는다. 배포본에 초안이 들어가면 안 된다.
      - name: 빌드
        run: node src/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
